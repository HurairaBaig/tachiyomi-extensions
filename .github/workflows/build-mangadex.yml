name: Build MangaDex Safe extension
on:
  push:
    branches: [mangadex-safe-legacy]
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'src/all/mangadex/**'
      - '.github/workflows/build-mangadex.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.3'
      - name: Build debug APK
        run: gradle :src:all:mangadex:assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangadex-safe-debug-apk
          path: src/all/mangadex/build/outputs/apk/debug/*.apk
          if-no-files-found: error
