name: Build and publish MangaDex Safe extension
on:
  push:
    branches: [publish/mangadex-safe-repo]
    paths:
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'extensions-lib/**'
      - 'src/all/mangadex/**'
      - '.github/workflows/build-mangadex.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch archived Tachiyomi 1.4 API stubs
        run: |
          git clone --depth 1 https://github.com/tachiyomiorg/extensions-lib.git /tmp/tachiyomi-extensions-lib
          mkdir -p extensions-lib/src/main
          cp -R /tmp/tachiyomi-extensions-lib/library/src/main/. extensions-lib/src/main/
          cp /tmp/tachiyomi-extensions-lib/LICENSE extensions-lib/LICENSE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.3'
          cache-disabled: true
      - name: Build extension APK
        run: gradle :src:all:mangadex:assembleDebug --no-daemon --stacktrace
      - name: Prepare repository index
        run: |
          mkdir -p repo
          cp src/all/mangadex/build/outputs/apk/debug/*.apk repo/tachiyomi-all.mangadex.safe-v1.5.2.apk
          cat > repo/index.min.json <<'JSON'
          [
            {
              "name": "MangaDex Safe",
              "pkg": "eu.kanade.tachiyomi.extension.all.mangadex.safe",
              "apk": "tachiyomi-all.mangadex.safe-v1.5.2.apk",
              "lang": "all",
              "code": 5,
              "version": "1.5.2",
              "nsfw": 0,
              "sources": [
                {
                  "name": "MangaDex Safe",
                  "lang": "all",
                  "id": "255964055",
                  "baseUrl": "https://mangadex.org"
                }
              ]
            }
          ]
          JSON
          python -m json.tool repo/index.min.json > /dev/null
      - name: Publish extension repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: ./repo
          force_orphan: true
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangadex-safe-1.5.2
          path: repo/*.apk
          if-no-files-found: error
