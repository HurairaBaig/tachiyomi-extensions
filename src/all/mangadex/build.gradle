plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
ext {
    extName = 'MangaDex Safe Test'
    pkgNameSuffix = 'all.mangadex.test'
    extClass = '.MangaDex'
    extVersionCode = 3
    libVersion = '1.4'
    isNsfw = false
}
android {
    namespace 'eu.kanade.tachiyomi.extension.all.mangadex.test'
    compileSdk 33
    defaultConfig {
        applicationId "eu.kanade.tachiyomi.extension.all.mangadex.test"
        minSdk 21
        targetSdk 28
        versionCode 3
        versionName "1.5.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions { jvmTarget = '11' }
}
dependencies {
    compileOnly project(':extensions-lib')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
